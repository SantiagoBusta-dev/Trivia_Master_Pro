<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Master Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">

        <!-- CABECERA -->
        <header class="header">
            <div class="profile-area" onclick="showScreen('profile-screen')">
                <div class="avatar-preview-container" id="header-avatar"></div>
                <span class="username-label" id="welcome-msg">¡Hola, Santiago!</span>
            </div>
            <div class="coins-badge" onclick="watchAd()">
                🪙 <span id="coin-count">235</span>
            </div>
        </header>

        <!-- CONTENIDO DINÁMICO DE PANTALLAS -->
        <main class="main-content">

            <!-- MENÚ PRINCIPAL -->
            <section id="main-menu" class="screen active">
                <h2 class="welcome-title">Menú Principal</h2>
                <div class="menu-buttons">
                    <button class="btn primary-btn" onclick="showScreen('levels-screen')">🚀 Jugar 100 Niveles</button>
                    <button class="btn secondary-btn" onclick="openCategories()">📚 Categorías</button>
                    <button class="btn event-btn" onclick="startSpecialEvent()">⭐ Evento Relámpago</button>
                    <button class="btn shop-btn" onclick="openShop()">🛍️ Tienda (Avatares y Mascotas)</button>
                    <button class="btn leaderboard-btn" onclick="openLeaderboard()">🏆 Tabla de Líderes</button>
                </div>
            </section>

            <!-- PERFIL -->
            <section id="profile-screen" class="screen">
                <div class="screen-header-row">
                    <button class="btn-back" onclick="showScreen('main-menu')">⬅️ Volver</button>
                    <h2>Configura tu Perfil</h2>
                </div>
                <div class="profile-form">
                    <p style="font-size: 0.85rem; color: #9ca3af;">Actualiza tu nombre de usuario</p>
                    <input type="text" id="username-input" placeholder="Tu nombre..." maxlength="15" value="Santiago">
                    <button class="btn primary-btn" onclick="saveUserProfile()">Guardar Nombre</button>
                </div>
            </section>

            <!-- NIVELES -->
            <section id="levels-screen" class="screen">
                <div class="screen-header-row">
                    <button class="btn-back" onclick="showScreen('main-menu')">⬅️ Volver</button>
                    <h2>Selecciona un Nivel</h2>
                </div>
                <div id="levels-grid" class="levels-grid"></div>
            </section>

            <!-- CATEGORÍAS -->
            <section id="categories-screen" class="screen">
                <div class="screen-header-row">
                    <button class="btn-back" onclick="showScreen('main-menu')">⬅️ Volver</button>
                    <h2>Elige una Categoría</h2>
                </div>
                <div id="categories-grid" class="categories-grid" style="display: flex; flex-direction: column; gap: 8px;"></div>
            </section>

            <!-- JUEGO (QUIZ) -->
            <section id="quiz-screen" class="screen">
                <div class="quiz-header">
                    <span id="quiz-title">Nivel 1</span>
                    <span id="question-counter">Pregunta 1/5</span>
                </div>
                <div class="question-box">
                    <p id="question-text">Cargando pregunta...</p>
                </div>
                <div id="answers-container" class="answers-grid"></div>
            </section>

            <!-- RESULTADOS -->
            <section id="result-screen" class="screen">
                <div class="profile-form" style="text-align: center;">
                    <h2>¡Resultado de la Partida!</h2>
                    <p style="font-size: 0.85rem; color: #9ca3af;">Puntaje obtenido:</p>
                    <h1 id="final-score" style="font-size: 1.8rem; color: #38bdf8;">0 / 5</h1>
                    <div id="earned-coins" style="font-weight: bold; color: #f59e0b;">🪙 +0</div>
                    <button class="btn primary-btn" onclick="returnToLevels()">Continuar</button>
                </div>
            </section>

            <!-- TIENDA -->
            <section id="shop-screen" class="screen">
                <div class="screen-header-row">
                    <button class="btn-back" onclick="showScreen('main-menu')">⬅️ Volver</button>
                    <h2>Tienda de Recompensas</h2>
                </div>
                <div id="shop-container" class="shop-scroll-area"></div>
            </section>

            <!-- RANKING -->
            <section id="leaderboard-screen" class="screen">
                <div class="screen-header-row">
                    <button class="btn-back" onclick="showScreen('main-menu')">⬅️ Volver</button>
                    <h2>Tabla de Líderes</h2>
                </div>
                <div class="leaderboard-list" id="leaderboard-list"></div>
            </section>

        </main>

        <!-- FOOTER / MASCOTA -->
        <footer id="footer-container" style="text-align: center; flex-shrink: 0;"></footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
