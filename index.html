<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Master Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header id="main-header">
            <div id="header-avatar"></div>
            <div id="welcome-msg">¡Hola, Jugador!</div>
            <div id="coin-container">🪙 <span id="coin-count">100</span></div>
        </header>

        <!-- Pantalla de Perfil -->
        <div id="profile-screen" class="screen active">
            <div class="card">
                <h1>🎮 Trivia Master Pro</h1>
                <p>Ingresa tu nombre para comenzar la aventura</p>
                <input type="text" id="username-input" placeholder="Tu nombre..." autocomplete="off">
                <button class="btn primary-btn" onclick="saveUserProfile()">¡Comenzar!</button>
            </div>
        </div>

        <!-- Menú Principal -->
        <div id="main-menu" class="screen">
            <div class="card menu-card">
                <h2>Menú Principal</h2>
                <button class="btn primary-btn" onclick="showScreen('levels-screen')">🚀 Jugar Niveles</button>
                <button class="btn secondary-btn" onclick="openCategories()">📂 Categorías</button>
                <button class="btn accent-btn" onclick="startSpecialEvent()">⚡ Evento Relámpago</button>
                <button class="btn secondary-btn" onclick="openLeaderboard()">🏆 Tabla de Líderes</button>
                <button class="btn shop-btn" onclick="showScreen('shop-screen')">🛒 Tienda</button>
                <button class="btn ad-btn" onclick="watchAd()">📺 Ver Anuncio (+20 🪙)</button>
            </div>
        </div>

        <!-- Pantalla de Niveles -->
        <div id="levels-screen" class="screen">
            <div class="header-nav">
                <button class="btn back-btn" onclick="showScreen('main-menu')">⬅ Volver</button>
                <h2>Selecciona un Nivel</h2>
            </div>
            <div id="levels-grid" class="grid-container"></div>
        </div>

        <!-- Pantalla de Cuestionario (Quiz) -->
        <div id="quiz-screen" class="screen">
            <div class="header-nav">
                <button class="btn back-btn" onclick="returnToLevels()">❌ Salir</button>
                <h2 id="quiz-title">Nivel 1</h2>
            </div>
            <div class="card quiz-card">
                <div id="question-counter">Pregunta 1/3</div>
                <div id="question-text">Cargando pregunta...</div>
                <div id="answers-container"></div>
            </div>
        </div>

        <!-- Pantalla de Resultados -->
        <div id="result-screen" class="screen">
            <div class="card result-card">
                <h2>¡Resultado del Nivel!</h2>
                <p>Aciertos: <span id="final-score">0 / 3</span></p>
                <p id="earned-coins">🪙 +0</p>
                <button class="btn primary-btn" onclick="returnToLevels()">Continuar</button>
            </div>
        </div>

        <!-- Pantalla de Categorías -->
        <div id="categories-screen" class="screen">
            <div class="header-nav">
                <button class="btn back-btn" onclick="showScreen('main-menu')">⬅ Volver</button>
                <h2>Categorías</h2>
            </div>
            <div id="categories-grid" class="grid-container"></div>
        </div>

        <!-- Pantalla de Tabla de Líderes -->
        <div id="leaderboard-screen" class="screen">
            <div class="header-nav">
                <button class="btn back-btn" onclick="showScreen('main-menu')">⬅ Volver</button>
                <h2>Tabla de Líderes</h2>
            </div>
            <div class="card" id="leaderboard-list"></div>
        </div>

        <!-- Pantalla de Tienda -->
        <div id="shop-screen" class="screen">
            <div class="header-nav">
                <button class="btn back-btn" onclick="showScreen('main-menu')">⬅ Volver</button>
                <h2>Tienda de Recompensas</h2>
            </div>
            <div id="shop-container" class="card"></div>
        </div>

        <!-- Footer con Mascota Interactiva -->
        <footer id="footer-container"></footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
